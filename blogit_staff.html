// ── 학습 원고 파일 읽기
async function readExampleFile(file) {
  if (file.type === "text/plain" || file.name.endsWith(".txt") || file.name.endsWith(".md")) {
    return new Promise(function(res, rej) {
      var r = new FileReader();
      r.onload = function() { res(r.result); };
      r.onerror = function() { rej(new Error("읽기 실패")); };
      r.readAsText(file, "UTF-8");
    });
  }
  if (file.name.endsWith(".docx")) {
    return new Promise(function(res, rej) {
      var r = new FileReader();
      r.onload = async function(ev) {
        try {
          var result = await mammoth.extractRawText({ arrayBuffer: ev.target.result });
          res(result.value);
        } catch(err) { rej(err); }
      };
      r.onerror = function() { rej(new Error("읽기 실패")); };
      r.readAsArrayBuffer(file);
    });
  }
  throw new Error(file.name + " — .docx 또는 .txt 파일만 가능합니다.");
}

function fileToBase64(file) {
  return new Promise((res,rej) => { const r=new FileReader(); r.onload=()=>res(r.result.split(",")[1]); r.onerror=()=>rej(new Error("읽기 실패")); r.readAsDataURL(file); });
}

function calcChars(t) { return t.replace(/#[^\s#]+(\s|$)/g,"").trim().length; }

function exportToWord(content, product, dealer, revLabel, blogTitle) {
  var title = "[블로그] " + dealer + " - " + product + " " + revLabel;
  function toWordHtml(text) {
    var lines = text.split("\n"); var html = ""; var i = 0;
    while (i < lines.length) {
      var line = lines[i];
      if (line.trim().startsWith("|")) {
        var tLines = []; while (i < lines.length && lines[i].trim().startsWith("|")) { tLines.push(lines[i]); i++; }
        var rows = tLines.filter(function(l){ return !/^\|[\s\-|]+\|?\s*$/.test(l.trim()); });
        html += '<table border="1" cellpadding="6" cellspacing="0" style="border-collapse:collapse;width:100%;font-size:10pt;margin:8pt 0;">';
        rows.forEach(function(row, ri) {
          var cells = row.split("|").map(function(c){ return c.trim(); }).filter(function(c,ci,arr){ return ci>0&&ci<arr.length-1; });
          html += "<tr>"; cells.forEach(function(cell) {
            if (ri===0) html += "<th style='background:#EEEDFE;color:#26215C;font-weight:bold;text-align:center;padding:6pt 8pt;border:1pt solid #CCC;'>" + cell + "</th>";
            else html += "<td style='text-align:center;padding:5pt 8pt;border:1pt solid #DDD;'>" + cell + "</td>";
          }); html += "</tr>";
        }); html += "</table>"; continue;
      }
      if (/^\*\*[^*]+\*\*$/.test(line.trim())) { html += "<p style='font-weight:bold;font-size:12pt;margin:12pt 0 4pt;color:#26215C;'>" + line.trim().replace(/\*\*/g,"") + "</p>"; i++; continue; }
      if (line.trim().startsWith("#")) { html += "<p style='font-size:9pt;color:#888;margin:2pt 0;'>" + line.trim() + "</p>"; i++; continue; }
      if (line.trim() === "") { html += "<p style='margin:4pt 0;'>&nbsp;</p>"; i++; continue; }
      var l = line.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\*(.+?)\*/g,"<i>$1</i>");
      html += "<p style='margin:3pt 0;line-height:1.7;'>" + l + "</p>"; i++;
    } return html;
  }
  var bodyHtml = toWordHtml(content);
  var html = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>" + title + "</title><style>body{font-family:'맑은 고딕',Arial;font-size:11pt;line-height:1.85;margin:48pt}h1{font-size:15pt;border-bottom:1.5pt solid #534AB7;padding-bottom:5pt;margin-bottom:8pt}h2{font-size:13pt;color:#26215C;margin-bottom:10pt}</style></head><body><h1>" + title + "</h1>" + (blogTitle?"<h2>"+blogTitle+"</h2>":"") + bodyHtml + "</body></html>";
  var blob = new Blob(["\ufeff",html],{type:"application/msword"});
  var url = URL.createObjectURL(blob); var a = document.createElement("a");
  a.href=url; a.download=dealer+"_"+product+"_"+revLabel+".doc";

function renderMarkdown(text) {
  var lines = text.split("\n"); var html = ""; var i = 0;
  while (i < lines.length) {
    var line = lines[i];
    if (line.trim().startsWith("|")) {
      var tLines = []; while (i < lines.length && lines[i].trim().startsWith("|")) { tLines.push(lines[i]); i++; }
      var rows = tLines.filter(function(l){ return !/^\|[\s\-|]+\|?\s*$/.test(l.trim()); });
      html += '<table style="width:100%;border-collapse:collapse;margin:14px 0;font-size:13px;">';
      rows.forEach(function(row,ri) {
        var cells = row.split("|").map(function(c){ return c.trim(); }).filter(function(c,ci,arr){ return ci>0&&ci<arr.length-1; });
        html += "<tr>"; cells.forEach(function(cell) {
          if(ri===0) html += "<th style='background:#EEEDFE;color:#26215C;padding:8px 12px;border:1px solid #D4D0F0;font-weight:600;text-align:center;'>" + applyInline(cell) + "</th>";
          else html += "<td style='padding:8px 12px;border:1px solid #E2E2DE;color:#1A1A18;text-align:center;'>" + applyInline(cell) + "</td>";
        }); html += "</tr>";
      }); html += "</table>"; continue;
    }
    if (/^\*\*[^*]+\*\*$/.test(line.trim())) { html += "<p style='font-weight:600;font-size:15px;color:#26215C;margin:18px 0 8px;border-left:3px solid #534AB7;padding-left:10px;'><b>" + line.trim().replace(/\*\*/g,"") + "</b></p>"; i++; continue; }
    if (line.trim().startsWith("#")) {
      var tags = line.trim().split(/\s+/);
      html += "<p style='margin:4px 0;'>" + tags.map(function(t){ return "<span style='display:inline-block;background:#EEEDFE;color:#534AB7;padding:3px 10px;margin:2px 3px;font-size:12px;border-radius:99px;font-weight:500;'>" + t + "</span>"; }).join("") + "</p>"; i++; continue;
    }
    if (line.trim() === "") { html += "<br>"; i++; continue; }
    html += "<p style='margin:3px 0;'>" + applyInline(line) + "</p>"; i++;
  } return html;
}
function applyInline(text) { return text.replace(/\*\*(.+?)\*\*/g,"<b style='color:#1A1A18;'>$1</b>").replace(/\*(.+?)\*/g,"<i style='color:#6B6B66;'>$1</i>"); }

async function callClaude(messages, system, maxTokens) {
  if (!PROXY_URL || PROXY_URL.includes("여기에")) {
    throw new Error("PROXY_URL이 설정되지 않았습니다. 파일에서 PROXY_URL에 Worker 주소를 입력해주세요.");
  }
  var body = { model:"claude-sonnet-4-20250514", max_tokens:maxTokens||3000, messages:messages };
  if(system) body.system = system;
  var res = await fetch(PROXY_URL, {
    method:"POST",
    headers:{ "Content-Type":"application/json", "x-access-code":getAccessCode() },
    body:JSON.stringify(body)
  });
  if(res.status === 401){ sessionStorage.removeItem("blogit_code"); throw new Error("접근 코드가 올바르지 않습니다. 새로고침 후 다시 입력해주세요."); }
  if(!res.ok) throw new Error("API 오류 " + res.status);
  var data = await res.json();
  return (data.content && data.content.find(function(b){ return b.type==="text"; }) || {}).text || "";
}
