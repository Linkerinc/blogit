function dealerPromptBlock(d, product) {
  if (!d) return "";
  var ctaText = (d.cta || "").replace(/\[제품명\]/g, product || "본 제품");
  var lines = [];
  lines.push("[발행 대리점 정보]");
  lines.push("- 대리점명: " + d.name);
  if (d.shop) lines.push("- 쇼핑몰명: " + d.shop);
  if (d.location) lines.push("- 소재지: " + d.location + " (※ 블로그 독자층은 전국 온라인이므로 소재지를 본문에 억지로 넣지 말 것)");
  if (d.handles) lines.push("- 취급: " + d.handles);
  if (d.specialty) lines.push("- 특화 품목: " + d.specialty + " (이 품목과 관련된 글일 때만 자연스럽게 살짝 언급)");
  if (ctaText) lines.push("- 마무리 CTA(반드시 본문 끝에 자연스럽게 포함): " + ctaText);
  if (d.neighbor) lines.push("- 서로이웃 인사 문구(서두 인사로 활용 가능, 강제 아님): " + d.neighbor);
  return lines.join("\n");
}

// ── 학습 원고 파일 읽기
async function readExampleFile(file) {
  if (file.type === "text/plain" || file.name.endsWith(".txt") || file.name.endsWith(".md")) {
    return new Promise(function(res, rej) {
      var r = new FileReader();
      r.onload = function() { res(r.result); };
      r.onerror = function() { rej(new Error("읽기 실패")); };
      r.readAsText(file, "UTF-8");
    });
  }
  if (file.name.endsWith(".docx")) {
    return new Promise(function(res, rej) {
      var r = new FileReader();
      r.onload = async function(ev) {
        try {
          var result = await mammoth.extractRawText({ arrayBuffer: ev.target.result });
          res(result.value);
        } catch(err) { rej(err); }
      };
      r.onerror = function() { rej(new Error("읽기 실패")); };
      r.readAsArrayBuffer(file);
    });
  }
  throw new Error(file.name + " — .docx 또는 .txt 파일만 가능합니다.");
}

function fileToBase64(file) {
  return new Promise((res,rej) => { const r=new FileReader(); r.onload=()=>res(r.result.split(",")[1]); r.onerror=()=>rej(new Error("읽기 실패")); r.readAsDataURL(file); });
}

// 이미지를 보내기 전 장변 1568px로 자동 축소 + JPEG 재인코딩 (용량/해상도 초과로 인한 API 오류 방지)
function imageToResizedBlock(file) {
  return new Promise(function(res, rej) {
    var MAX_EDGE = 1568;
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function() {
      try {
        var w = img.naturalWidth, h = img.naturalHeight;
        var scale = Math.min(1, MAX_EDGE / Math.max(w, h));
        var nw = Math.max(1, Math.round(w * scale));
        var nh = Math.max(1, Math.round(h * scale));
        var canvas = document.createElement("canvas");
        canvas.width = nw; canvas.height = nh;
        var ctx = canvas.getContext("2d");
        ctx.fillStyle = "#FFFFFF"; ctx.fillRect(0, 0, nw, nh); // 투명 PNG 대비 흰 배경
        ctx.drawImage(img, 0, 0, nw, nh);
        var dataUrl = canvas.toDataURL("image/jpeg", 0.85);
        URL.revokeObjectURL(url);
        res({ media_type: "image/jpeg", data: dataUrl.split(",")[1] });
      } catch(err) { URL.revokeObjectURL(url); rej(err); }
    };
    img.onerror = function() { URL.revokeObjectURL(url); rej(new Error("이미지 로드 실패")); };
    img.src = url;
  });
}

function exportToWord(content, product, dealer, revLabel, blogTitle) {
  var title = "[블로그] " + dealer + " - " + product + " " + revLabel;
  function toWordHtml(text) {
    var lines = text.split("\n"); var html = ""; var i = 0;
    while (i < lines.length) {
      var line = lines[i];
      if (line.trim().startsWith("|")) {
        var tLines = []; while (i < lines.length && lines[i].trim().startsWith("|")) { tLines.push(lines[i]); i++; }
        var rows = tLines.filter(function(l){ return !/^\|[\s\-|]+\|?\s*$/.test(l.trim()); });
        html += '<table border="1" cellpadding="6" cellspacing="0" style="border-collapse:collapse;width:100%;font-size:10pt;margin:8pt 0;">';
        rows.forEach(function(row, ri) {
          var cells = row.split("|").map(function(c){ return c.trim(); }).filter(function(c,ci,arr){ return ci>0&&ci<arr.length-1; });
          html += "<tr>"; cells.forEach(function(cell) {
            if (ri===0) html += "<th style='background:#EEEDFE;color:#26215C;font-weight:bold;text-align:center;padding:6pt 8pt;border:1pt solid #CCC;'>" + cell + "</th>";
            else html += "<td style='text-align:center;padding:5pt 8pt;border:1pt solid #DDD;'>" + cell + "</td>";
          }); html += "</tr>";
        }); html += "</table>"; continue;
      }
      if (/^\*\*[^*]+\*\*$/.test(line.trim())) { html += "<p style='font-weight:bold;font-size:12pt;margin:12pt 0 4pt;color:#26215C;'>" + line.trim().replace(/\*\*/g,"") + "</p>"; i++; continue; }
      if (line.trim().startsWith("#")) { html += "<p style='font-size:9pt;color:#888;margin:2pt 0;'>" + line.trim() + "</p>"; i++; continue; }
      if (line.trim() === "") { html += "<p style='margin:4pt 0;'>&nbsp;</p>"; i++; continue; }
      var l = line.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\*(.+?)\*/g,"<i>$1</i>");
      html += "<p style='margin:3pt 0;line-height:1.7;'>" + l + "</p>"; i++;
    } return html;
  }
  var bodyHtml = toWordHtml(content);
  var html = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>" + title + "</title><style>body{font-family:'맑은 고딕',Arial;font-size:11pt;line-height:1.85;margin:48pt}h1{font-size:15pt;border-bottom:1.5pt solid #534AB7;padding-bottom:5pt;margin-bottom:8pt}h2{font-size:13pt;color:#26215C;margin-bottom:10pt}</style></head><body><h1>" + title + "</h1>" + (blogTitle?"<h2>"+blogTitle+"</h2>":"") + bodyHtml + "</body></html>";
  var blob = new Blob(["\ufeff",html],{type:"application/msword"});
  var url = URL.createObjectURL(blob); var a = document.createElement("a");
  a.href=url; a.download=dealer+"_"+product+"_"+revLabel+".doc";
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}

function renderMarkdown(text) {
  var lines = text.split("\n"); var html = ""; var i = 0;
  while (i < lines.length) {
    var line = lines[i];
    if (line.trim().startsWith("|")) {
      var tLines = []; while (i < lines.length && lines[i].trim().startsWith("|")) { tLines.push(lines[i]); i++; }
      var rows = tLines.filter(function(l){ return !/^\|[\s\-|]+\|?\s*$/.test(l.trim()); });
      html += '<table style="width:100%;border-collapse:collapse;margin:14px 0;font-size:13px;">';
      rows.forEach(function(row,ri) {
        var cells = row.split("|").map(function(c){ return c.trim(); }).filter(function(c,ci,arr){ return ci>0&&ci<arr.length-1; });
        html += "<tr>"; cells.forEach(function(cell) {
          if(ri===0) html += "<th style='background:#EEEDFE;color:#26215C;padding:8px 12px;border:1px solid #D4D0F0;font-weight:600;text-align:center;'>" + applyInline(cell) + "</th>";
          else html += "<td style='padding:8px 12px;border:1px solid #E2E2DE;color:#1A1A18;text-align:center;'>" + applyInline(cell) + "</td>";
        }); html += "</tr>";
      }); html += "</table>"; continue;
    }
    if (/^\*\*[^*]+\*\*$/.test(line.trim())) { html += "<p style='font-weight:600;font-size:15px;color:#26215C;margin:18px 0 8px;border-left:3px solid #534AB7;padding-left:10px;'><b>" + line.trim().replace(/\*\*/g,"") + "</b></p>"; i++; continue; }
    if (line.trim().startsWith("#")) {
      var tags = line.trim().split(/\s+/);
      html += "<p style='margin:4px 0;'>" + tags.map(function(t){ return "<span style='display:inline-block;background:#EEEDFE;color:#534AB7;padding:3px 10px;margin:2px 3px;font-size:12px;border-radius:99px;font-weight:500;'>" + t + "</span>"; }).join("") + "</p>"; i++; continue;
    }
    if (line.trim() === "") { html += "<br>"; i++; continue; }
    html += "<p style='margin:3px 0;'>" + applyInline(line) + "</p>"; i++;
  } return html;
}
function applyInline(text) { return text.replace(/\*\*(.+?)\*\*/g,"<b style='color:#1A1A18;'>$1</b>").replace(/\*(.+?)\*/g,"<i style='color:#6B6B66;'>$1</i>"); }

async function callClaude(messages, system, maxTokens) {
  if (!PROXY_URL || PROXY_URL.includes("여기에")) {
    throw new Error("PROXY_URL이 설정되지 않았습니다. 파일에서 PROXY_URL에 Worker 주소를 입력해주세요.");
  }
  var body = { model:"claude-sonnet-4-6", max_tokens:maxTokens||3000, messages:messages };
  if(system) body.system = system;
  var res = await fetch(PROXY_URL, {
    method:"POST",
    headers:{ "Content-Type":"application/json", "x-access-code":getAccessCode() },
    body:JSON.stringify(body)
  });
  if(res.status === 401){ sessionStorage.removeItem("blogit_code"); throw new Error("접근 코드가 올바르지 않습니다. 새로고침 후 다시 입력해주세요."); }
  if(!res.ok) throw new Error("API 오류 " + res.status);
  var data = await res.json();
  return (data.content && data.content.find(function(b){ return b.type==="text"; }) || {}).text || "";
}

          e("textarea",{style:Object.assign({},inp,{width:"100%",resize:"vertical",minHeight:72,marginBottom:10}),value:revRequest,onChange:function(ev){setRevRequest(ev.target.value);},placeholder:'"3단락 톤을 더 부드럽게 바꿔줘"\n"마무리 문장을 더 강하게 다듬어줘"'}),
          e("button",{style:S.btnMain(!revRequest.trim()||revising),onClick:revise,disabled:revising||!revRequest.trim()},revising?"⏳  수정 중...":"✏  수정 요청")
        ),

        // ── 이미지 프롬프트 섹션
        e("div",{style:{background:C.orangeLight,border:"1px solid #FCD34D",borderRadius:12,padding:"16px",marginBottom:16}},
          e("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}},
            e("div",null,
              e("div",{style:{fontSize:14,fontWeight:500,color:"#92400E",marginBottom:3}},"📸  이미지 프롬프트 생성"),
              e("div",{style:{fontSize:12,color:"#B45309"}},"원고를 분석해서 이미지 배치와 프롬프트를 자동 생성합니다.")
            )
          ),
          e("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}},
            e("div",null,
              e("label",{style:{display:"block",fontSize:12,color:"#92400E",marginBottom:5,fontWeight:500}},"이미지 개수 (기본 10개)"),
              e("input",{type:"number",min:3,max:20,style:Object.assign({},inp,{width:"100%",background:"#fff"}),value:imageCount,onChange:function(ev){var n=parseInt(ev.target.value);if(!isNaN(n)&&n>=3&&n<=20)setImageCount(n);}})
            ),
            e("div",null,
              e("label",{style:{display:"block",fontSize:12,color:"#92400E",marginBottom:5,fontWeight:500}},"이미지 AI 선택"),
              e("div",{style:{display:"flex",gap:6}},
                Object.entries(IMAGE_AI_SYSTEMS).map(function(entry){ var id=entry[0], ai=entry[1]; var on=selectedAI===id; return e("button",{key:id,onClick:function(){setSelectedAI(id);},style:{flex:1,padding:"9px 8px",borderRadius:8,border:on?"2px solid "+ai.color:"1px solid "+C.border,background:on?ai.light:"#fff",color:on?ai.color:C.muted,fontSize:12,fontWeight:on?600:400,cursor:"pointer",fontFamily:"inherit"}},ai.label); })
              )
            )
          ),
          e("button",{
            style:{width:"100%",padding:"12px",borderRadius:8,border:"none",background:generatingImages?"#D1D5DB":C.orange,color:"#fff",fontSize:13,fontWeight:500,cursor:generatingImages?"not-allowed":"pointer",fontFamily:"inherit"},
            onClick:generateImagePrompts, disabled:generatingImages
          }, generatingImages?"⏳  프롬프트 생성 중...":"🎨  이미지 프롬프트 생성")
        ),

        // ── 생성된 이미지 프롬프트 결과
        showImageSection && imagePrompts.length>0 && e("div",{style:{background:C.surf,border:"1px solid "+C.border,borderRadius:12,padding:"16px",marginBottom:16}},
          e("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}},
            e("div",null,
              e("div",{style:{fontSize:14,fontWeight:500,color:C.text,marginBottom:3}},"이미지 프롬프트 "+imagePrompts.length+"개 — "+IMAGE_AI_SYSTEMS[selectedAI].label+"용"),
              e("div",{style:{fontSize:12,color:C.muted}},"각 프롬프트를 복사하여 AI 이미지 생성 도구에 붙여넣으세요.")
            ),
            e("button",{style:{padding:"7px 14px",borderRadius:8,border:"1px solid "+C.border,background:"transparent",color:C.text,fontSize:12,cursor:"pointer",fontFamily:"inherit"},onClick:copyAllPrompts},"전체 복사")
          ),
          e("div",{style:{display:"flex",flexDirection:"column",gap:10}},
            imagePrompts.map(function(img,i){
              var ai = IMAGE_AI_SYSTEMS[selectedAI];
              var isCopied = copiedImgIdx === i;
              var isThumb = img.number === 1;
              return e("div",{key:i,style:{padding:"14px",borderRadius:10,border:"1px solid "+(isThumb?"#FCD34D":C.border),background:isThumb?C.orangeLight:C.bg}},
                e("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}},
                  e("span",{style:{display:"inline-block",fontSize:11,fontWeight:600,background:isThumb?C.orange:C.accent,color:"#fff",padding:"2px 8px",borderRadius:4}},"이미지 "+img.number+(isThumb?" (썸네일)":"")),
                  e("button",{style:{padding:"5px 12px",borderRadius:6,border:"1px solid "+(isCopied?ai.color:C.border),background:isCopied?ai.light:"transparent",color:isCopied?ai.color:C.muted,fontSize:11,cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap"},onClick:function(){copyImg(i, img.prompt);}},isCopied?"✓ 복사됨":"복사")
                ),
                img.subject && e("div",{style:{fontSize:14,fontWeight:600,color:C.text,marginBottom:6}},img.subject),
                img.description && e("div",{style:{fontSize:13,color:C.text,lineHeight:1.6,marginBottom:8}},e("span",{style:{color:C.muted,marginRight:4}},"🖼 이미지 설명:"),img.description),
                (img.placement||img.placementReason) && e("div",{style:{fontSize:13,color:C.purpleDark,background:C.purpleLight,border:"1px solid #D4D0F0",borderRadius:8,padding:"8px 10px",lineHeight:1.6,marginBottom:8}},
                  e("div",null,e("b",null,"📍 원고 배치: "),img.placement||""),
                  img.placementReason && e("div",{style:{color:C.muted,fontSize:12,marginTop:2}},img.placementReason)
                ),
                e("div",{style:{fontSize:11,color:C.muted,marginBottom:4}},"AI 생성 프롬프트 ↓"),
                e("div",{style:{fontSize:12,color:C.muted,background:C.surf,padding:"10px",borderRadius:6,lineHeight:1.6,fontFamily:"monospace",wordBreak:"break-all"}},img.prompt)
              );
            })
          )
        ),

        // ── 수정 이력
        history.length>1 && e("div",{style:{marginBottom:16,padding:"12px 16px",background:C.surf,border:"1px solid "+C.border,borderRadius:10}},
          e("p",{style:{fontSize:12,fontWeight:500,color:C.muted,margin:"0 0 10px",textTransform:"uppercase",letterSpacing:"0.05em"}},"수정 이력"),
          history.slice(1).map(function(h,i){ return e("div",{key:i,style:{padding:"8px 0",borderBottom:i<history.length-2?"1px solid "+C.border:"none",fontSize:13}},
            e("div",null,
              e("b",{style:{color:C.text,fontWeight:500,marginRight:10}},h.label),
              e("span",{style:{color:C.muted,marginRight:10}},h.timestamp),
              e("span",{style:{color:C.text}},'"'+h.request+'"')
            ),
            h.applied && h.applied.length>0 && e("div",{style:{marginTop:5,paddingLeft:2,fontSize:12,color:"#3B6D11",lineHeight:1.6}},
              h.applied.map(function(a,j){ return e("div",{key:j},"✓ "+a); })

        )

    )
  );
}

ReactDOM.render(React.createElement(App), document.getElementById("root"));
